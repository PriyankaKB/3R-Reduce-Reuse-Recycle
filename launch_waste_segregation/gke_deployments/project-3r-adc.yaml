# ==============================================================================
# KUBERNETES SERVICE ACCOUNT (WORKLOAD IDENTITY / ADC LINK)
# ==============================================================================

# serviceAccountName: project-3r-gke-sa is configured under spec.template.spec.
# GOOGLE_GENAI_USE_VERTEXAI is set to "True" along with GOOGLE_CLOUD_PROJECT so the SDK automatically uses Vertex AI via ADC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: project-3r-gke-sa
  namespace: default
  annotations:
    iam.gke.io/gcp-service-account: "project-3r-gke-sa@<your_cloud_project_name>.iam.gserviceaccount.com"
  
---
# ==============================================================================
# CONFIGMAP (Environment Targets Only)
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: project-3r-config
data:
  GCP_PROJECT_ID: "your-gcp-project-id"
  GCS_WASTE_BUCKET: "your-3r-waste-bucket"
  BQ_DATASET: "waste_segregation_3r"
  BQ_TELEMETRY_TABLE: "gke_segregation_telemetry"
  SEGREGATION_AGENT_URL: "http://adk-segregation-service:8080/process"
  ROBOTIC_ARM_AGENT_URL: "http://adk-robotic-service:8081/process"
  HMI_AGENT_URL: "http://adk-hmi-service:8082/process"
  DISPATCH_AGENT_URL: "http://adk-dispatch-service:8083/process"

---
# ==============================================================================
# 1. SEGREGATION AGENT (Port 8080 - GPU Node / Native ADC Engine)
# ==============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: segregation-agent
  namespace: default
  labels:
    app.kubernetes.io/name: segregation-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: segregation-agent
  template:
    metadata:
      labels:
        app: segregation-agent
    spec:
      serviceAccountName: project-3r-gke-sa
      nodeSelector:
        iam.gke.io/gke-metadata-server-enabled: "true" # Required for GKE Standard (omit for Autopilot)
      containers:
      - name: agent
        image: <your_cloud_project_location>-docker.pkg.dev/<your_cloud_project_name>/project-3r-repo/segregation-agent:latest
        imagePullPolicy: Always
        env:
        - name: GOOGLE_CLOUD_PROJECT
          value: "<your_cloud_project_name>"
        - name: GOOGLE_CLOUD_LOCATION
          value: "<your_cloud_project_location>"
        - name: GOOGLE_GENAI_USE_VERTEXAI
          value: "True"
        - name: GEMINI_MODEL
          value: "gemini-2.5-flash"
        - name: GCS_BUCKET
          value: "3r-autonoumous-waste-segregation-<your_cloud_project_name>"
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
---

apiVersion: v1
kind: Service
metadata:
  name: segregation-service
spec:
  type: ClusterIP
  selector:
    app: segregation-agent
  ports:
  - port: 8080
    targetPort: 8080

---
